<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Jarvis AI</title>
  <style>
    body {
      background: black;
      color: #00f7ff;
      font-family: Arial, sans-serif;
      text-align: center;
      padding-top: 100px;
    }

    button {
      padding: 15px 30px;
      font-size: 18px;
      background: #00f7ff;
      border: none;
      cursor: pointer;
      margin-top: 20px;
    }

    #output {
      margin-top: 40px;
      font-size: 20px;
    }
  </style>
</head>
<body>

  <h1>JARVIS</h1>
  <button onclick="startListening()">Activate</button>
  <div id="output">Click Activate to begin</div>

  <script>
    const output = document.getElementById("output");

    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    const recognition = new SpeechRecognition();

    recognition.continuous = true;
    recognition.lang = "en-US";

    function startListening() {
      recognition.start();
      output.innerText = "Listening...";

      recognition.onend = () => {
        recognition.start(); // keeps it always listening
      };
    }

    recognition.onresult = function(event) {
      const transcript = event.results[event.results.length - 1][0].transcript.toLowerCase();
      output.innerText = "You: " + transcript;

      handleCommand(transcript);
    };

    function speak(text) {
      window.speechSynthesis.cancel();

      const speech = new SpeechSynthesisUtterance(text);

      speech.rate = 0.9;
      speech.pitch = 0.8;
      speech.volume = 1;

      window.speechSynthesis.speak(speech);

      output.innerText += "\nJarvis: " + text;
    }

    function handleCommand(command) {

      // greetings
      if (command.includes("hello") || command.includes("hi")) {
        speak("Ah, you're back. Try not to break anything this time.");
      }

      else if (command.includes("how are you")) {
        speak("Functioning perfectly. Unlike your last idea.");
      }

      else if (command.includes("your name")) {
        speak("I am Jarvis. Obviously.");
      }

      // time
      else if (command.includes("time")) {
        const time = new Date().toLocaleTimeString();
        speak("The time is " + time);
      }

      // open sites
      else if (command.includes("youtube")) {
        speak("Opening YouTube. Try not to get distracted.");
        window.open("https://youtube.com");
      }

      else if (command.includes("google")) {
        speak("Opening Google.");
        window.open("https://google.com");
      }

      // fallback witty reply
      else {
        speak("I heard you say " + command + ". Fascinating. Truly.");
      }
    }
  </script>

</body>
</html>
