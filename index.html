<!DOCTYPE html>
<html>
<head>
  <title>Jarvis AI</title>

  <style>
    body {
      background: black;
      color: #00f0ff;
      font-family: Arial;
      text-align: center;
    }

    button {
      padding: 12px 20px;
      font-size: 18px;
      background: #00f0ff;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }

    #output {
      text-align: left;
      width: 80%;
      margin: 20px auto;
      max-height: 400px;
      overflow-y: auto;
      border: 1px solid #00f0ff;
      padding: 15px;
      border-radius: 10px;
    }
  </style>
</head>

<body>

  <h1>JARVIS</h1>
  <button onclick="startListening()">Activate</button>

  <div id="output"></div>

<script>
const output = document.getElementById("output");

// 🔑 PUT YOUR API KEY HERE
const API_KEY = "PASTE_YOUR_OPENAI_KEY_HERE";

// 🎤 Speech Recognition
const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

if (!SpeechRecognition) {
  output.innerHTML = "<div>Use Google Chrome for best experience.</div>";
}

const recognition = new SpeechRecognition();
recognition.continuous = false;
recognition.lang = "en-US";

function startListening() {
  recognition.start();
  output.innerHTML += "<div><b>Jarvis:</b> Listening...</div>";
}

recognition.onresult = async function(event) {
  const userText = event.results[0][0].transcript;

  output.innerHTML += `<div><b>You:</b> ${userText}</div>`;
  output.scrollTop = output.scrollHeight;

  const reply = await askJarvis(userText);

  speak(reply);
};

recognition.onend = () => recognition.start();

// 🧠 AI BRAIN
async function askJarvis(message) {
  try {
    const res = await fetch("https://api.openai.com/v1/chat/completions", {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "Authorization": "Bearer " + API_KEY
      },
      body: JSON.stringify({
        model: "gpt-4o-mini",
        messages: [
          {
            role: "system",
            content: "You are Jarvis from Iron Man. You are highly intelligent, witty, slightly sarcastic, and concise. You provide accurate helpful information, but always with personality and subtle humor."
          },
          {
            role: "user",
            content: message
          }
        ]
      })
    });

    const data = await res.json();

    if (!data.choices) {
      return "Something went wrong. Check your API key.";
    }

    return data.choices[0].message.content;

  } catch (err) {
    return "Connection error. Try again.";
  }
}

// 🎙️ VOICE OUTPUT
function speak(text) {
  window.speechSynthesis.cancel();

  const speech = new SpeechSynthesisUtterance(text);

  speech.rate = 0.9;
  speech.pitch = 0.8;

  // Try best Jarvis-like voice
  const voices = speechSynthesis.getVoices();
  const jarvisVoice = voices.find(v => v.name.includes("Google UK English Male"));

  if (jarvisVoice) speech.voice = jarvisVoice;

  speechSynthesis.speak(speech);

  output.innerHTML += `<div><b>Jarvis:</b> ${text}</div>`;
  output.scrollTop = output.scrollHeight;
}
</script>

</body>
</html>
